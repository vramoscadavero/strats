[project]
name = "strats"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vrasmos", email = "vramos120304@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "awpy>=3.1.1",
    "polars>=2.0.0",
]

[project.scripts]
strats = "strats:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
]
